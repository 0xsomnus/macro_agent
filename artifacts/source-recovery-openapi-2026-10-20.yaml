            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/daily-reviews/{review_id}/synthesise/:
    post:
      operationId: synthesise_daily_review
      description: One explicitly selected model call over an exact retained digest.
        It preserves digest publication and creates no new publication or external
        notification authority. Exact retries inspect durable admission without another
        provider request.
      parameters:
      - in: path
        name: review_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
