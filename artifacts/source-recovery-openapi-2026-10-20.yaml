openapi: 3.0.3
info:
  title: Macro Agent desk API
  version: 1.0.0
paths:
  /api/v1/daily-publications/{publication_id}/:
    get:
      operationId: get_daily_publication
      description: Read an immutable publication decision and exact retained review,
        with present disposition and notification-intent state observed separately
        in a read-only snapshot. No source fetch, model call, publication write or
        external delivery.
      parameters:
      - in: path
        name: publication_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal daily publication
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPublicationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/daily-reviews/{review_id}/:
    get:
      operationId: get_daily_review
      description: Read an owner-scoped immutable daily evidence review, verifying
        its saved content digest. Exact original outcome and inputs remain unchanged
        when present dependencies are stale. Present disposition is observed separately
        in one read-only snapshot. This is not a published current morning brief and
        grants no notification or retry authority. No source fetch, model catalogue
        call, inference or write fallback.
      parameters:
      - in: path
        name: review_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal daily reviews
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReviewDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/daily-reviews/{review_id}/publication-preview/:
    get:
      operationId: preview_daily_publication
      description: Read exact review digest and current generation for explicit publication
        review. Preview makes no state changes, source requests, model calls or notification
        intents.
      parameters:
      - in: query
        name: fanout_limit
        schema:
          type: integer
        description: Explicit publication fanout limit from 1 to 1000; no inferred
          default.
        required: true
      - in: path
        name: review_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal daily publication
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPublicationPreview'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/daily-reviews/{review_id}/publish/:
    post:
      operationId: publish_daily_review
      description: Explicit one-off session/CSRF publication of the exact review digest
        at the expected generation under the requested fanout bound. Compare dependencies,
        publication pointer and atomic internal notification intent in one protected
        transaction. Saved-command replay retains the original decision. This does
        not enroll automatic publication or enable external delivery.
      parameters:
      - in: path
        name: review_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal daily publication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishDailyReviewRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPublicationDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
