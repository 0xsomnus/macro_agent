    get:
      operationId: get_daily_synthesis_command
      description: Saved-command inspection without keys, catalogue requests or POST
        fallback.
      parameters:
      - in: path
        name: command_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: review_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - daily synthesis
      security:
      - cookieAuth: []
      responses:
