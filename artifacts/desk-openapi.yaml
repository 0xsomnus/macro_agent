openapi: 3.0.3
info:
  title: Macro Agent desk API
  version: 1.0.0
paths:
  /api/v1/lab/theses/{thesis_id}/recorded-news/:
    post:
      operationId: recorded_news
      description: Development-only fictional event against your committed approval
        and paper declarations. Requires explicit local settings, synthetic setup
        permission and a development/test database. No model, live source, inferred
        portfolio impact, external delivery or continuous monitoring is provided.
        Repeating the same current context returns its existing notice without another
        interruption.
      parameters:
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - development examples
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordedNewsRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordedNewsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/models/:
    get:
      operationId: compilation_model_catalog
      description: Development-only explicit model catalogue from the configured provider.
        Requires local settings, the model-compilation gate and a development/test
        database. Prices are advertised metadata, not final charges. The API key is
        never returned. No model is selected automatically.
      tags:
      - internal compilation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/positions/{position_id}/:
    get:
      operationId: get_position
      parameters:
      - in: path
        name: position_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - paper positions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/positions/{position_id}/close/:
    post:
      operationId: close_position
      description: Explicitly close the paper position after comparing its current
        revision and thesis approval. This saves history only and does not send a
        broker order.
      parameters:
      - in: path
        name: position_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - paper positions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosePositionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionCommandResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/positions/{position_id}/history/:
    get:
      operationId: position_history
      description: Read one consistent effective-time history snapshot. Each category
        is capped at 100 records with explicit truncation. This is not durable known-at
        replay or a complete export when truncated.
      parameters:
      - in: path
        name: position_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - paper positions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionHistory'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/positions/{position_id}/revisions/:
    post:
      operationId: revise_position
      description: Save a complete new immutable paper declaration after comparing
        the current position revision and reviewed thesis approval. A closed position
        cannot be reopened.
      parameters:
      - in: path
        name: position_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - paper positions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisePositionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionCommandResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/:
    get:
      operationId: list_theses
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size from 1 to 100; default 20.
      - in: query
        name: offset
        schema:
          type: integer
        description: Offset from 0 to 1000000; default 0.
      tags:
      - theses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    post:
      operationId: create_thesis
      description: Save exact thesis text and a user-supplied interpretation preview.
        This creates a draft only.
      tags:
      - theses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThesisRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisCommandResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/{thesis_id}/:
    get:
      operationId: get_thesis
      parameters:
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - theses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/{thesis_id}/approvals/:
    post:
      operationId: approve_thesis
      description: Explicitly approve the exact displayed draft and interpretation
        by version and digest.
      parameters:
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - theses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveThesisRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisCommandResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/{thesis_id}/compilations/{attempt_id}/:
    get:
      operationId: get_compilation
      description: Read an owner-scoped saved compilation attempt and its current
        draft disposition. A running or unknown attempt is visible without initiating
        inference or retries. The response does not assert factual verification, approval
        or continuous monitoring.
      parameters:
      - in: path
        name: attempt_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal compilation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompilationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/{thesis_id}/compile/:
    post:
      operationId: compile_thesis
      description: Development-only one-call text-grounded compilation using an explicit
        catalogue model. The authenticated owner supplies no credentials or provider
        configuration in this request. The result is a suggested draft interpretation
        with separate unverified questions and hypotheses. Exact thesis text and current
        approval remain unchanged. Explicit user approval is still required. There
        are no fact sources, current macro context, model tools or monitoring daemon.
        Inspect status even on HTTP 200; saved command retries do not initiate another
        model call.
      parameters:
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal compilation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompileThesisRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompilationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/{thesis_id}/history/:
    get:
      operationId: thesis_history
      description: Read approval-effective-time history for the internal prototype.
        Each history category is bounded to 100 records; truncated is explicit. This
        is not full operational known-at replay.
      parameters:
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - theses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisHistory'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/{thesis_id}/positions/:
    get:
      operationId: list_positions
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size from 1 to 100; default 20.
      - in: query
        name: offset
        schema:
          type: integer
        description: Offset from 0 to 1000000; default 0.
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - paper positions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    post:
      operationId: create_position
      description: Attach a user-declared paper position to the exact current thesis
        approval. Missing mapping or sizing information remains explicit; no broker
        execution or coverage is implied.
      parameters:
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - paper positions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePositionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionCommandResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/{thesis_id}/proposals/:
    post:
      operationId: propose_thesis
      description: Save a new immutable draft. Approved text and interpretation remain
        active until explicit approval.
      parameters:
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - theses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposeThesisRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisCommandResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
components:
  schemas:
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text_version_id:
          type: string
          format: uuid
        interpretation_version_id:
          type: string
          format: uuid
        text_digest:
          type: string
        interpretation_digest:
          type: string
        approved_at:
          type: string
          format: date-time
        digest:
          type: string
        revision:
          type: integer
      required:
      - approved_at
      - digest
      - id
      - interpretation_digest
      - interpretation_version_id
      - revision
      - text_digest
      - text_version_id
    ApproveThesisRequest:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        thesis_version_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        text_digest:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
        interpretation_version_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        interpretation_digest:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
        expected_revision:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
      required:
      - command_id
      - expected_revision
      - interpretation_digest
      - interpretation_version_id
      - text_digest
      - thesis_version_id
      additionalProperties: false
    Approved:
      type: object
      properties:
        text_version:
          $ref: '#/components/schemas/TextVersion'
        interpretation:
          $ref: '#/components/schemas/Interpretation'
        approval:
          $ref: '#/components/schemas/Approval'
      required:
      - approval
      - interpretation
      - text_version
    AuditEvent:
      type: object
      properties:
        sequence:
          type: integer
        kind:
          type: string
        at:
          type: string
          format: date-time
        detail: {}
      required:
      - at
      - detail
      - kind
      - sequence
    BasisEnum:
      enum:
      - recorded_fixture
      type: string
      description: '* `recorded_fixture` - recorded_fixture'
    CatalogModel:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 512
        context_length:
          type: integer
          minimum: 1
          nullable: true
        input_price_usd_per_million:
          type: string
          nullable: true
          description: Advertised USD per million input tokens, or unknown. Not a
            final charge.
        output_price_usd_per_million:
          type: string
          nullable: true
          description: Advertised USD per million output tokens, or unknown. Not a
            final charge.
        capabilities:
          type: object
          additionalProperties:
            type: boolean
      required:
      - capabilities
      - context_length
      - id
      - input_price_usd_per_million
      - name
      - output_price_usd_per_million
    ClosePositionRequest:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        expected_revision:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        expected_approval_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
      required:
      - command_id
      - expected_approval_id
      - expected_revision
      additionalProperties: false
    Command:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CommandKindEnum'
        replayed:
          type: boolean
        result:
          $ref: '#/components/schemas/CommandResult'
        is_current_approval:
          type: boolean
      required:
      - command_id
      - is_current_approval
      - kind
      - replayed
      - result
    CommandKindEnum:
      enum:
      - create
      - propose
      - approve
      type: string
      description: |-
        * `create` - create
        * `propose` - propose
        * `approve` - approve
    CommandResult:
      type: object
      properties:
        thesis_id:
          type: string
          format: uuid
        thesis_version_id:
          type: string
          format: uuid
        interpretation_version_id:
          type: string
          format: uuid
        approval_id:
          type: string
          format: uuid
          nullable: true
        revision:
          type: integer
        accepted_at:
          type: string
          format: date-time
      required:
      - accepted_at
      - approval_id
      - interpretation_version_id
      - revision
      - thesis_id
      - thesis_version_id
    Compilation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          allOf:
          - $ref: '#/components/schemas/CompilationStatusEnum'
          description: |-
            Explicit attempt disposition. HTTP 200 does not mean compilation succeeded. An unknown outcome may have incurred provider cost and must not be retried implicitly.

            * `running` - running
            * `outcome_unknown` - outcome_unknown
