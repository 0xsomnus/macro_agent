  /api/v1/theses/{thesis_id}/compilation-commands/{command_id}/:
    get:
      operationId: get_compilation_command
      description: Read-only recovery by the command UUID saved before transmission.
        No provider credentials, catalogue lookup, inference or POST fallback. Historical
        results are shown alongside current draft disposition.
      parameters:
      - in: path
        name: command_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal compilation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompilationResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
