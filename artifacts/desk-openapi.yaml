          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionCommandResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/:
    get:
      operationId: list_theses
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size from 1 to 100; default 20.
      - in: query
        name: offset
        schema:
          type: integer
        description: Offset from 0 to 1000000; default 0.
      tags:
      - theses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThesisList'
          description: ''
        '400':
