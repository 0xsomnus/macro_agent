          description: ''
  /api/v1/theses/{thesis_id}/analyse-next/:
    post:
      operationId: analyse_next_report
      description: Automatically select the next retained report from the chosen source
        and perform at most one explicitly initiated model call. Inspect status even
        on HTTP 200. Admission is saved before inference; command retries return history
        without another call. Approved meaning, paper declarations, screening work
        and notification intents remain unchanged. Attributed quotations are report
        claims; portfolio effects are unverified hypotheses. This one-pass review
        is not a daemon, verified macro context or full coverage.
      parameters:
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal news analysis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyseNextRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsAnalysisResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/{thesis_id}/approvals/:
    post:
      operationId: approve_thesis
      description: Explicitly approve the exact displayed draft and interpretation
        by version and digest.
      parameters:
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - theses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveThesisRequest'
