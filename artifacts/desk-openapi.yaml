  /api/v1/theses/{thesis_id}/news-analyses/{attempt_id}/:
    get:
      operationId: get_news_analysis
      description: Read owner-scoped immutable analysis history and its current dependency
        disposition. Reading a running or unknown attempt never initiates inference
        or a retry.
      parameters:
      - in: path
        name: attempt_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal news analysis
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
