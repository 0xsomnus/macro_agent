components:
  schemas:
    AnalyseNextRequestRequest:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        expected_approval_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        expected_exposure_digest:
          type: string
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          maxLength: 64
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        provider_id:
          $ref: '#/components/schemas/ModelProviderEnum'
        model_id:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - command_id
      - expected_approval_id
      - expected_exposure_digest
      - model_id
      - provider_id
      - source_id
      additionalProperties: false
    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text_version_id:
          type: string
          format: uuid
        interpretation_version_id:
          type: string
          format: uuid
        text_digest:
          type: string
        interpretation_digest:
          type: string
        approved_at:
          type: string
          format: date-time
        digest:
          type: string
        revision:
          type: integer
      required:
      - approved_at
      - digest
      - id
      - interpretation_digest
      - interpretation_version_id
      - revision
      - text_digest
      - text_version_id
    ApproveThesisRequest:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        thesis_version_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        text_digest:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
        interpretation_version_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        interpretation_digest:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
        expected_revision:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
      required:
      - command_id
      - expected_revision
      - interpretation_digest
      - interpretation_version_id
      - text_digest
      - thesis_version_id
      additionalProperties: false
    Approved:
      type: object
      properties:
        text_version:
          $ref: '#/components/schemas/TextVersion'
        interpretation:
          $ref: '#/components/schemas/Interpretation'
        approval:
          $ref: '#/components/schemas/Approval'
      required:
      - approval
      - interpretation
      - text_version
    ApprovedNewsInterpretation:
      type: object
      properties:
        drivers:
          type: array
          items:
            type: string
            maxLength: 1000
          maxItems: 32
        horizon:
          type: string
          nullable: true
          maxLength: 1000
        invalidation_signposts:
          type: array
          items:
            type: string
            maxLength: 1000
          maxItems: 32
        review_card:
          allOf:
          - $ref: '#/components/schemas/PinnedReviewCard'
          nullable: true
      required:
      - drivers
      - horizon
      - invalidation_signposts
      additionalProperties: false
    AuditEvent:
      type: object
      properties:
        sequence:
          type: integer
        kind:
          type: string
        at:
          type: string
          format: date-time
        detail: {}
      required:
      - at
      - detail
      - kind
      - sequence
    BasisEnum:
      enum:
      - recorded_fixture
      type: string
      description: '* `recorded_fixture` - recorded_fixture'
    CatalogModel:
      type: object
      properties:
        id:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 512
        context_length:
          type: integer
          minimum: 1
          nullable: true
        input_price_usd_per_million:
          type: string
          nullable: true
          description: Advertised USD per million input tokens, or unknown. Not a
            final charge.
        output_price_usd_per_million:
          type: string
          nullable: true
          description: Advertised USD per million output tokens, or unknown. Not a
            final charge.
        capabilities:
          type: object
          additionalProperties:
            type: boolean
      required:
      - capabilities
      - context_length
      - id
      - input_price_usd_per_million
      - name
      - output_price_usd_per_million
    ClosePositionRequest:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        expected_revision:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        expected_approval_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
      required:
      - command_id
      - expected_approval_id
      - expected_revision
      additionalProperties: false
    Command:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/CommandKindEnum'
        replayed:
          type: boolean
        result:
          $ref: '#/components/schemas/CommandResult'
        is_current_approval:
          type: boolean
      required:
      - command_id
      - is_current_approval
      - kind
      - replayed
      - result
    CommandKindEnum:
      enum:
      - create
      - propose
      - approve
      type: string
      description: |-
        * `create` - create
        * `propose` - propose
        * `approve` - approve
    CommandResult:
      type: object
      properties:
        thesis_id:
          type: string
          format: uuid
        thesis_version_id:
          type: string
          format: uuid
        interpretation_version_id:
          type: string
          format: uuid
        approval_id:
          type: string
          format: uuid
          nullable: true
        revision:
          type: integer
        accepted_at:
          type: string
          format: date-time
      required:
      - accepted_at
      - approval_id
      - interpretation_version_id
      - revision
      - thesis_id
      - thesis_version_id
    Compilation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          allOf:
          - $ref: '#/components/schemas/CompilationStatusEnum'
          description: |-
            Explicit attempt disposition. HTTP 200 does not mean compilation succeeded. An unknown outcome may have incurred provider cost and must not be retried implicitly.

            * `running` - running
            * `outcome_unknown` - outcome_unknown
            * `compiled` - compiled
            * `stale` - stale
            * `failed` - failed
        provider:
          $ref: '#/components/schemas/ModelProviderEnum'
        model_id:
          type: string
          maxLength: 255
        input_text_version:
          $ref: '#/components/schemas/CompilationTextInput'
        schema_version:
          type: string
        prompt_version:
          type: string
        refinement_id:
          type: string
          format: uuid
          nullable: true
        parent_attempt_id:
          type: string
          format: uuid
          nullable: true
        refinement_inputs:
          type: array
          items:
            $ref: '#/components/schemas/RefinementInput'
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        document:
          allOf:
          - $ref: '#/components/schemas/CompilationDocument'
          nullable: true
        interpretation_version_id:
          type: string
          format: uuid
          nullable: true
        is_current_draft:
          type: boolean
          description: Protected response snapshot of whether this interpretation
            remains the latest draft. A draft is not user approval or active monitoring.
        usage:
          $ref: '#/components/schemas/CompilationUsage'
        reported_cost_usd:
          type: string
          nullable: true
        estimated_cost_usd:
          type: string
          nullable: true
          description: Estimate from recorded catalogue pricing and reported token
            usage; unknown is null.
        reported_model:
          type: string
          nullable: true
        provider_request_id:
          type: string
          nullable: true
        latency_ms:
          type: integer
          minimum: 0
          nullable: true
        stop_reason:
          type: string
          nullable: true
        limitations:
          type: array
          items:
            type: string
      required:
      - created_at
      - document
      - estimated_cost_usd
      - finished_at
      - id
      - input_text_version
      - interpretation_version_id
      - is_current_draft
      - latency_ms
      - limitations
      - model_id
      - parent_attempt_id
      - prompt_version
      - provider
      - provider_request_id
      - refinement_id
      - refinement_inputs
      - reported_cost_usd
      - reported_model
      - schema_version
      - status
      - stop_reason
      - usage
    CompilationDocument:
      type: object
      properties:
        interpretation:
          $ref: '#/components/schemas/InterpretationInput'
        grounding:
          type: array
          items:
            $ref: '#/components/schemas/CompilationGrounding'
        refinement_issues:
          type: array
          items:
            $ref: '#/components/schemas/CompilationRefinementIssue'
        agent_hypotheses:
          type: array
          items:
            $ref: '#/components/schemas/CompilationHypothesis'
        counter_case:
          type: string
          nullable: true
          maxLength: 2000
        review_card:
          allOf:
          - $ref: '#/components/schemas/ReviewSections'
          description: Required for current v2 model output; absent in retained historical
            v1 documents. The complete card combines these sections with interpretation,
            counter-case and questions.
      required:
      - agent_hypotheses
      - counter_case
      - grounding
      - interpretation
      - refinement_issues
      additionalProperties: false
    CompilationGrounding:
      type: object
      properties:
        field:
          $ref: '#/components/schemas/CompilationGroundingFieldEnum'
        index:
          type: integer
          maximum: 31
          minimum: 0
          nullable: true
        input_id:
          type: string
          description: Named original thesis or exact trader-answer input. Absent
            only in historical v1 documents.
          maxLength: 100
        exact_quote:
          type: string
          maxLength: 1000
      required:
      - exact_quote
      - field
      - index
      additionalProperties: false
    CompilationGroundingFieldEnum:
      enum:
      - drivers
      - horizon
      - invalidation_signposts
      type: string
      description: |-
        * `drivers` - drivers
        * `horizon` - horizon
        * `invalidation_signposts` - invalidation_signposts
    CompilationHypothesis:
      type: object
      properties:
        explanation:
          type: string
          maxLength: 2000
        introduced_assumptions:
          type: array
          items:
            type: string
            maxLength: 1000
          maxItems: 32
      required:
      - explanation
      - introduced_assumptions
      additionalProperties: false
    CompilationRefinementIssue:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/CompilationRefinementIssueKindEnum'
        input_id:
          type: string
          nullable: true
          maxLength: 100
        exact_quote:
          type: string
          nullable: true
          maxLength: 1000
        explanation:
          type: string
          maxLength: 2000
        question:
          type: string
          maxLength: 1000
      required:
      - exact_quote
      - explanation
      - kind
      - question
      additionalProperties: false
    CompilationRefinementIssueKindEnum:
      enum:
      - missing_detail
      - unsupported_mechanism
      - verification_needed
      - ambiguity
      - defensible_disagreement
      type: string
      description: |-
        * `missing_detail` - missing_detail
        * `unsupported_mechanism` - unsupported_mechanism
        * `verification_needed` - verification_needed
        * `ambiguity` - ambiguity
        * `defensible_disagreement` - defensible_disagreement
    CompilationResponse:
      type: object
      properties:
        compilation:
          $ref: '#/components/schemas/Compilation'
        thesis:
          $ref: '#/components/schemas/ThesisDetail'
      required:
      - compilation
      - thesis
    CompilationStatusEnum:
      enum:
      - running
      - outcome_unknown
      - compiled
      - stale
      - failed
      type: string
      description: |-
        * `running` - running
        * `outcome_unknown` - outcome_unknown
        * `compiled` - compiled
        * `stale` - stale
        * `failed` - failed
    CompilationTextInput:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parent_version_id:
          type: string
          format: uuid
          nullable: true
        exact_text:
          type: string
        text_digest:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - exact_text
      - id
      - parent_version_id
      - text_digest
    CompilationUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
          nullable: true
        completion_tokens:
          type: integer
          minimum: 0
          nullable: true
        total_tokens:
          type: integer
          minimum: 0
          nullable: true
      required:
      - completion_tokens
      - prompt_tokens
      - total_tokens
    CompileThesisRequestRequest:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        refinement_id:
          type: string
          format: uuid
          nullable: true
          minLength: 1
          maxLength: 36
        expected_revision:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        provider_id:
          allOf:
          - $ref: '#/components/schemas/ModelProviderEnum'
          description: |-
            Provider identity shown by the catalogue, pinned against backend configuration.

            * `nanogpt` - nanogpt
            * `openrouter` - openrouter
            * `cheaperinference` - cheaperinference
        model_id:
          type: string
          minLength: 1
          description: Explicit model ID selected from the configured provider catalogue.
            No automatic routing.
          maxLength: 255
      required:
      - command_id
      - expected_revision
      - model_id
      - provider_id
      additionalProperties: false
    ContextStatusEnum:
      enum:
      - ready
      type: string
      description: '* `ready` - ready'
    CreatePositionRequest:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        expected_approval_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        position:
          $ref: '#/components/schemas/PositionDeclarationRequest'
      required:
      - command_id
      - expected_approval_id
      - position
      additionalProperties: false
    CreateThesisRequest:
      type: object
      properties:
        command_id:
          type: string
          format: uuid
          minLength: 1
          maxLength: 36
        text:
          type: string
          minLength: 1
