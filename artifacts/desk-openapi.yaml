openapi: 3.0.3
info:
  title: Macro Agent desk API
  version: 1.0.0
paths:
  /api/v1/daily-reviews/{review_id}/:
    get:
      operationId: get_daily_review
      description: Read an owner-scoped immutable daily evidence review, verifying
        its saved content digest. Exact original outcome and inputs remain unchanged
        when present dependencies are stale. Present disposition is observed separately
        in one read-only snapshot. This is not a published current morning brief and
        grants no notification or retry authority. No source fetch, model catalogue
        call, inference or write fallback.
      parameters:
      - in: path
        name: review_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal daily reviews
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReviewDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/lab/theses/{thesis_id}/recorded-news/:
    post:
      operationId: recorded_news
      description: Development-only fictional event against your committed approval
        and paper declarations. Requires explicit local settings, synthetic setup
        permission and a development/test database. No model, live source, inferred
        portfolio impact, external delivery or continuous monitoring is provided.
        Repeating the same current context returns its existing notice without another
        interruption.
      parameters:
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - development examples
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordedNewsRequestRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordedNewsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/models/:
    get:
      operationId: compilation_model_catalog
      description: Development-only explicit model catalogue from the configured provider.
        Requires local settings, the model-compilation gate and a development/test
        database. Prices are advertised metadata, not final charges. The API key is
        never returned. No model is selected automatically.
      tags:
      - internal compilation
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalogResponse'
          description: ''
        '400':
