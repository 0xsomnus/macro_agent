          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/positions/{position_id}/revisions/:
    post:
      operationId: revise_position
      description: Save a complete new immutable paper declaration after comparing
        the current position revision and reviewed thesis approval. A closed position
        cannot be reopened.
      parameters:
      - in: path
        name: position_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - paper positions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisePositionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
