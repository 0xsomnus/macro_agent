  /api/v1/theses/{thesis_id}/news-commands/{command_id}/:
    get:
      operationId: get_news_command_receipt
      description: Recover an owner-scoped saved news command by its client-generated
        UUID. This GET performs no model catalogue call, inference, approval or write
        fallback. Inspect status and current disposition even on HTTP 200. An absent
        or inaccessible receipt is opaque and does not authorize another paid attempt.
      parameters:
      - in: path
        name: command_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal news analysis
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
