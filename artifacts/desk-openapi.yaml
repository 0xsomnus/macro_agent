          type: string
          nullable: true
          minLength: 10
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          maxLength: 10
        quote_currency:
          type: string
          nullable: true
          minLength: 1
          maxLength: 16
        horizon:
          type: string
          nullable: true
          minLength: 1
          maxLength: 1000
        quantity:
          type: string
          nullable: true
          minLength: 1
          description: Positive fixed decimal string, at most 28 digits total and
            12 fractional places. Trailing zeroes are preserved; this is a declaration,
            not sizing arithmetic.
          pattern: ^(?:0|[1-9][0-9]{0,27})(?:\.[0-9]{1,12})?$
          maxLength: 29
        quantity_unit:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
