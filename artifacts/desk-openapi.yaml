  /api/v1/positions/{position_id}/close/:
    post:
      operationId: close_position
      description: Explicitly close the paper position after comparing its current
        revision and thesis approval. This saves history only and does not send a
        broker order.
      parameters:
      - in: path
        name: position_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - paper positions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosePositionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionCommandResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/positions/{position_id}/history/:
    get:
      operationId: position_history
      description: Read one consistent effective-time history snapshot. Each category
        is capped at 100 records with explicit truncation. This is not durable known-at
        replay or a complete export when truncated.
      parameters:
      - in: path
        name: position_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - paper positions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
