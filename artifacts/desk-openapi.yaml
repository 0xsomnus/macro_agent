          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/{thesis_id}/daily-reviews/:
    get:
      operationId: list_daily_reviews
      description: Read owner-scoped summaries in descending cutoff and ID order.
        Count, page and present dependency disposition share one repeatable-read,
        read-only snapshot. Subsequent requests get a new snapshot; offset pagination
        is not a historical cursor. Original outcome stays separate from present disposition.
        No full context, current publication claim, source fetch, model catalogue
        call, inference or write fallback.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size from 1 to 100; default 20.
      - in: query
        name: offset
        schema:
          type: integer
        description: Offset from 0 to 1000000; default 0.
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - internal daily reviews
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReviewList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /api/v1/theses/{thesis_id}/history/:
    get:
      operationId: thesis_history
      description: Read approval-effective-time history for the internal prototype.
        Each history category is bounded to 100 records; truncated is explicit. This
        is not full operational known-at replay.
      parameters:
      - in: path
        name: thesis_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - theses
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
